# 테스트 전용 설정 (pom.xml 의 surefire 설정에서 -Dmyauct.config 로 지정)
# H2 메모리 DB 를 MySQL 호환 모드로 사용 → 실제 MySQL(kuk2028) 은 건드리지 않는다
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:myauct;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE,KEY;DB_CLOSE_DELAY=-1
db.username=sa
db.password=test
upload.path=target/test-upload
juso.confmKey=

# 테스트 중에는 마감 처리 스케줄러를 끈다 (테스트가 직접 호출)
auction.closer.enabled=false
